version: '3.9'
services:
  stock-price-mockapi:
    build:
      context: ./stock-price-mockapi
    ports:
      - "8081:8081"
    
  stock-price-server:
    build:
      context: ./stock-price-server
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - THIRD_PART_API_BASE_URL=http://stock-price-mockapi:8081/
